<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Snake</title>
		<link rel="stylesheet" href="snake.css">
		<script src="snake.js" defer></script>
	</head>
<body>
	<img src="Assets/Title.png" alt="Snek Title" style="width: 500px;">
	
	<div class="game-container">
		<canvas id="board"></canvas>
		<button id="restartBtn" onclick="startGame()" style="display: none;">Start Game</button>
	</div> 
	
	<h1>How to Play</h1>
	<p>Arrow Key or WASD to move</p>
	<p>Don't touch the white squares (They are walls)</p>
	<p>Go to the red square to grow :)</p>
</body> 
</html>
